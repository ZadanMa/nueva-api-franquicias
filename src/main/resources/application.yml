spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/franquicias?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false&connectionTimeZone=UTC&allowLoadLocalInfile=true
    username: root
    password: admin
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
    initialization-mode: always
    schema: classpath:schema.sql

logging:
  level:
    org.springframework.cloud.aws: ERROR
    com.amazonaws: ERROR
    org.springframework.web: INFO
    root: INFO
    io.asyncer.r2dbc.mysql: WARN
    org.springframework.data.r2dbc: DEBUG 